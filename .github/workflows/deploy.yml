name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: FastPanel (asfeccert.phoenixtechs.tech)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pull, install, and refresh Laravel
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: "22"
          command_timeout: 20m
          script: |
            set -euo pipefail
            export HOME=/var/www/phoenixtechs-asfeccert/data
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/bin:${HOME}/.local/bin"
            export GIT_TERMINAL_PROMPT=0
            export COMPOSER_HOME="${HOME}/.composer"

            APP_DIR="/var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech"
            # PHP 8.2+ is required (8.3 recommended). Update when the site's PHP version changes in FastPanel.
            PHP="/opt/php83/bin/php"
            [ -x "$PHP" ] || PHP="/opt/php82/bin/php"
            COMPOSER="/usr/local/bin/composer"

            cd "$APP_DIR"

            echo "Fetching origin/main"
            git remote set-url origin "https://github.com/Phoenix-H22/Certificates-Generator.git"
            git fetch origin

            OLD_HEAD="$(git rev-parse HEAD)"
            if git reset --hard origin/main; then
              echo "Reset to origin/main"
            else
              echo "Hard reset blocked; updating writable files only"
              git diff --name-only HEAD origin/main | while IFS= read -r f; do
                [ -z "$f" ] && continue
                if [ -e "$f" ] && [ ! -w "$f" ]; then
                  echo "skip unwritable $f"
                  continue
                fi
                git checkout origin/main -- "$f"
              done
              git reset origin/main
            fi
            NEW_HEAD="$(git rev-parse HEAD)"
            CHANGED="$(git diff --name-only "$OLD_HEAD" "$NEW_HEAD" || true)"

            if printf '%s\n' "$CHANGED" | grep -qxE 'composer\.(json|lock)' \
              || [ ! -f vendor/autoload.php ]; then
              echo "Installing Composer dependencies"
              "$PHP" "$COMPOSER" install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            else
              echo "Skipping composer install (no composer.json/lock changes)"
            fi

            if command -v npm >/dev/null 2>&1; then
              if printf '%s\n' "$CHANGED" | grep -qxE 'package(-lock)?\.json' \
                || [ ! -d node_modules/puppeteer ]; then
                echo "Installing Node dependencies (puppeteer)"
                npm ci --omit=dev --no-audit --no-fund
                npx puppeteer browsers install chrome
              else
                echo "Skipping npm ci (no package.json/lock changes)"
              fi
            else
              echo "WARNING: npm not found — certificate rendering needs Node.js + Chromium (see docs/DEPLOYMENT.md)"
            fi

            if printf '%s\n' "$CHANGED" | grep -qE '^database/migrations/'; then
              echo "Running migrations"
              "$PHP" artisan migrate --force
            else
              echo "Skipping migrate (no new migration files)"
            fi

            [ -L public/storage ] || "$PHP" artisan storage:link

            echo "Refreshing caches"
            "$PHP" artisan optimize:clear
            "$PHP" artisan optimize

            echo "Restarting all queues (render, deliver, default)"
            "$PHP" artisan queue:restart

            # Workers are managed by Supervisor (deploy/supervisor/certificates-generator.conf).
            # queue:restart above makes them exit gracefully and Supervisor brings them back.
            # Never spawn ad-hoc nohup workers on a Supervisor host: that duplicates workers
            # and bypasses the nice/ionice/memory limits that protect the other sites.
            if command -v supervisorctl >/dev/null 2>&1; then
              restarted=""
              for group in asfeccert cg asfeccert-queue; do
                if supervisorctl status "${group}:*" >/dev/null 2>&1; then
                  supervisorctl restart "${group}:*" && restarted="$group"
                  break
                fi
              done
              if [ -n "$restarted" ]; then
                echo "Supervisor group ${restarted}:* restarted"
              else
                echo "WARNING: no Supervisor program found for this app; install deploy/supervisor/certificates-generator.conf"
              fi
            else
              echo "WARNING: Supervisor not installed; queue workers must be started manually (see docs/DEPLOYMENT.md)"
            fi

            echo "Deployed $(git log -1 --oneline)"
