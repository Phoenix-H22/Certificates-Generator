; Supervisor programs for the certificate queues on asfeccert.phoenixtechs.tech.
; Replaces /etc/supervisor/conf.d/asfeccert-queue.conf, then:
;   supervisorctl reread && supervisorctl update && supervisorctl status
;
; Resource budget on a shared server:
;   * ONE render worker → at most one headless Chromium at a time (~300 MB RAM, 2–4 s CPU per PDF).
;   * nice/ionice so other sites always win CPU and disk.
;   * --memory=256 restarts a worker whose PHP heap grows; --max-jobs/--max-time recycle regularly.
;   * Chromium's own timeout is CERT_RENDER_TIMEOUT (default 90 s) so a hung browser cannot pile up.

[program:asfeccert-render]
command=/usr/bin/nice -n 10 /usr/bin/ionice -c2 -n7 /opt/php82/bin/php /var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech/artisan queue:work --queue=render --sleep=3 --tries=2 --timeout=180 --memory=256 --max-jobs=100 --max-time=3600
directory=/var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech
user=phoenixtechs-asfeccert
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=200
redirect_stderr=true
stdout_logfile=/var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech/storage/logs/queue-render.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:asfeccert-deliver]
command=/usr/bin/nice -n 10 /usr/bin/ionice -c2 -n7 /opt/php82/bin/php /var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech/artisan queue:work --queue=deliver,default --sleep=3 --tries=3 --timeout=120 --memory=256 --max-jobs=300 --max-time=3600
directory=/var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech
user=phoenixtechs-asfeccert
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=130
redirect_stderr=true
stdout_logfile=/var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech/storage/logs/queue-deliver.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[group:asfeccert]
programs=asfeccert-render,asfeccert-deliver
