; Supervisor programs for the certificate queues.
; Copy to /etc/supervisor/conf.d/certificates-generator.conf, adjust paths/user,
; then: supervisorctl reread && supervisorctl update && supervisorctl start cg:*
;
; Rendering spawns a headless Chromium (~300 MB RAM, 1–3 s per certificate).
; Keep ONE render worker unless the server has 4 GB+ RAM to spare.

[program:cg-render]
command=/opt/php83/bin/php /var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech/artisan queue:work --queue=render --sleep=2 --tries=2 --timeout=180 --max-jobs=200 --max-time=3600
directory=/var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech
user=phoenixtechs-asfeccert
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=200
redirect_stderr=true
stdout_logfile=/var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech/storage/logs/queue-render.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:cg-deliver]
command=/opt/php83/bin/php /var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech/artisan queue:work --queue=deliver,default --sleep=2 --tries=3 --timeout=120 --max-jobs=500 --max-time=3600
directory=/var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech
user=phoenixtechs-asfeccert
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=130
redirect_stderr=true
stdout_logfile=/var/www/phoenixtechs-asfeccert/data/www/asfeccert.phoenixtechs.tech/storage/logs/queue-deliver.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[group:cg]
programs=cg-render,cg-deliver
